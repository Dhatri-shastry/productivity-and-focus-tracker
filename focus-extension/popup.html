<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Productivity Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            min-width: 320px;
            background: #fff;
            color: #222;
        }
        h3 {
            margin: 0 0 12px;
            font-size: 1.4em;
            color: #2c3e50;
        }
        #data {
            font-size: 0.95em;
            line-height: 1.5;
        }
        button {
            margin-top: 16px;
            padding: 8px 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        button:hover {
            background: #c0392b;
        }
        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <h3>Website usage</h3>
    <div id="data">Loading...</div>

    <button id="clear">Clear All Data</button>

    <script src="popup.js"></script>
</body>
</html>
